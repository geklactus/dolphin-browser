name: Build

# Packages wasm-dolphin's browser page (the Dolphin GameCube/Wii emulator compiled to
# WebAssembly) from the repository pinned in `wasm-dolphin-repo` at the commit pinned in
# `wasm-dolphin-commit`, with the patches in patches/ applied. Nothing is compiled: upstream commits its prebuilt
# core (dolphin-core-upstream.{js,wasm}, SHA-256 pinned in its own page), and the patches
# touch only the page's JavaScript. Every run uploads the result as a workflow artifact; a
# tag push (v*) or a manual run with a version also publishes it as a GitHub release, which
# is what consumers download and verify by sha256.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish (creates tag v<version>); empty = build only"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Read the pin
        id: pins
        run: |
          echo "repo=$(tr -d '[:space:]' < wasm-dolphin-repo)" >> "$GITHUB_OUTPUT"
          echo "commit=$(tr -d '[:space:]' < wasm-dolphin-commit)" >> "$GITHUB_OUTPUT"
          ver="${{ github.event.inputs.version }}"
          if [ -z "$ver" ] && [ "${GITHUB_REF_TYPE}" = tag ]; then ver="${GITHUB_REF_NAME#v}"; fi
          [ -n "$ver" ] || ver="0.0.0-$(tr -d '[:space:]' < wasm-dolphin-commit | cut -c1-7)"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "wasm-dolphin $(cat wasm-dolphin-repo) @ $(cat wasm-dolphin-commit) · version $ver"

      - name: Checkout wasm-dolphin at the pinned commit
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.pins.outputs.repo }}
          ref: ${{ steps.pins.outputs.commit }}
          fetch-depth: 1
          path: upstream

      - name: Apply patches
        run: |
          set -e
          shopt -s nullglob
          cd upstream
          for p in ../patches/*.patch; do
            echo "== $p"
            git apply --verbose "$p"
          done
          git status --short

      - name: The prebuilt core is the one the page pins
        working-directory: upstream
        run: |
          set -e
          pinned=$(grep -o 'DEFAULT_UPSTREAM_CORE_SHA256 = "[0-9a-f]*"' src/upstream-worker-protocol.js | grep -o '[0-9a-f]\{64\}')
          actual=$(sha256sum cores/dolphin/dolphin-core-upstream.wasm | cut -c1-64)
          echo "pinned $pinned"; echo "actual $actual"
          [ "$pinned" = "$actual" ]
          node --check src/app.js
          node --check src/upstream-discio-worker.js

      - name: Package
        id: pkg
        run: |
          set -e
          ver="${{ steps.pins.outputs.version }}"
          name="dolphin-browser-$ver"
          mkdir -p "dist/$name/cores/dolphin"
          cp upstream/index.html "dist/$name/"
          cp -r upstream/src "dist/$name/src"
          rm -f "dist/$name"/src/wgpu-geometry-packet.js "dist/$name"/src/wgpu-leaf-replay-executor.js \
                "dist/$name"/src/wgpu-renderer-worker-control.js "dist/$name"/src/wgpu-ubo-packet.js   # not imported by anything
          cp upstream/cores/dolphin/dolphin-core-upstream.js upstream/cores/dolphin/dolphin-core-upstream.wasm "dist/$name/cores/dolphin/"
          cp upstream/LICENSE "dist/$name/LICENSE-wasm-dolphin.txt"
          {
            echo "dolphin-browser $ver"
            echo "wasm-dolphin-repo: ${{ steps.pins.outputs.repo }}"
            echo "wasm-dolphin-commit: ${{ steps.pins.outputs.commit }}"
            echo "wasm-dolphin-source: https://github.com/${{ steps.pins.outputs.repo }}/tree/${{ steps.pins.outputs.commit }}"
            echo "dolphin-commit: $(python3 -c 'import json;u=json.load(open("upstream/provenance/dolphin-source.lock.json"))["upstream"];print(u.get("commit") or u.get("sha") or u)')"
            echo "core-sha256: $(sha256sum upstream/cores/dolphin/dolphin-core-upstream.wasm | cut -c1-64)"
            echo "patches:"; ls patches/*.patch 2>/dev/null | sed 's/^/  /'
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ) by ${{ github.repository }} run ${{ github.run_id }}"
          } > "dist/$name/MANIFEST"
          (cd "dist/$name" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" | tee "$name.tar.gz.sha256")
          du -sh "dist/$name" && cat "dist/$name/MANIFEST"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            dist/${{ steps.pkg.outputs.name }}.tar.gz
            dist/${{ steps.pkg.outputs.name }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' || github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ver="${{ steps.pins.outputs.version }}"
          name="${{ steps.pkg.outputs.name }}"
          tag="v$ver"
          notes="$(cat "dist/$name/MANIFEST"; echo; echo '```'; cat "dist/$name.tar.gz.sha256"; echo '```')"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "dist/$name.tar.gz" "dist/$name.tar.gz.sha256" --clobber
          else
            gh release create "$tag" "dist/$name.tar.gz" "dist/$name.tar.gz.sha256" \
              --target "$GITHUB_SHA" --title "$name" --notes "$notes"
          fi
